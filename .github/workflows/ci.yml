name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [habitat, hearth, halcyon, hephaestus]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps
        run: |
          pnpm --filter "@palladium/core" build
          pnpm --filter "@palladium/sqlite-browser" build
          pnpm --filter "@palladium/sqlite-capacitor" build
          pnpm --filter "@palladium/nuxt" build
          pnpm --filter "@palladium/worker" build

      - name: Prepare (generate tsconfig)
        run: pnpm --filter ${{ matrix.app }} exec nuxt prepare

      - name: Lint & format check
        run: pnpm --filter ${{ matrix.app }} check

      - name: Typecheck
        run: pnpm --filter ${{ matrix.app }} typecheck

      - name: Unit tests
        run: pnpm --filter ${{ matrix.app }} test:unit

      - name: Install Hephaestus browser runtime
        if: matrix.app == 'hephaestus'
        run: pnpm exec playwright install --with-deps chromium

      - name: Hephaestus local PWA release gate
        if: matrix.app == 'hephaestus'
        run: pnpm --filter hephaestus test:e2e

      - name: Retain Hephaestus browser evidence
        if: failure() && matrix.app == 'hephaestus'
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-browser-results
          path: |
            apps/hephaestus/test-results/
            apps/hephaestus/playwright-report/
          if-no-files-found: ignore

  sync:
    name: Palladium sync and resilience
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: palladium
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: palladium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palladium -d palladium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://palladium:local-ci-only@localhost:5432/palladium_test
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install configured Linux linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Rust formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Test Rust, Postgres, and OIDC integration
        run: cargo test --locked --workspace --features palladium-postgres/integration-tests,atrium/oidc-testcontainers
      - name: Check and build sync clients
        run: |
          pnpm --filter @palladium/core lint
          pnpm --filter @palladium/core typecheck
          pnpm --filter @palladium/core build
          pnpm --filter @palladium/sqlite-node build
          pnpm --filter @palladium/e2e typecheck
      - name: Client contracts and deterministic simulation
        run: pnpm --filter @palladium/core test
      - name: Live Rust server end-to-end and network faults
        run: pnpm --filter @palladium/e2e test
      - name: Build browser recovery prerequisites
        run: |
          pnpm --filter @palladium/sqlite-browser build
          pnpm --filter @palladium/worker build
          pnpm --filter @palladium/react build
          pnpm --filter @palladium/example-react typecheck
          pnpm --filter @palladium/example-multitab typecheck
      - name: Install browser recovery runtime
        run: pnpm --filter @palladium/example-react exec playwright install --with-deps chromium
      - name: Browser OPFS sync and ownership recovery
        run: |
          pnpm --filter @palladium/example-react exec playwright test
          pnpm --filter @palladium/example-multitab exec playwright test
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recovery-results
          path: |
            libs/palladium/example-react/test-results/
            libs/palladium/example-multitab/test-results/
          if-no-files-found: ignore
      - name: Extended replayable simulation campaign
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PALLADIUM_SIM_SEEDS: "1000"
        run: pnpm --filter @palladium/core exec vitest run src/__tests__/sync-replica-simulation.test.ts
      - name: Architecture gate
        run: pnpm lint:deps
